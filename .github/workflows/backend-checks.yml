# Runs the backend's tests on every pull request into main or dev that touches
# Backend/. A merge into main then deploys the staging API (deploy-backend.yml).
name: Backend checks

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "Backend/**"
      - ".github/workflows/backend-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14" # the Docker image's Python
          cache: pip
          cache-dependency-path: Backend/requirements.lock
      - run: pip install -r requirements.lock
      - name: python manage.py test core
        run: |
          # Committed test settings with every key blank or fake: no test may
          # reach a paid or real service, and no secret is needed.
          set -a; . ./.env.ci; set +a
          python manage.py test core --settings=config.test_settings

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # The same build Cloud Build runs on a deploy; .dockerignore keeps .env out.
      - run: docker build --pull --tag taskflow-api:check Backend
      - name: The image starts its Python and imports Django
        run: docker run --rm --entrypoint python taskflow-api:check -c "import django, gunicorn, psycopg; print(django.get_version())"
