# Checks every pull request into main or dev that touches the app: the
# analyzer and the whole test suite. A merge into main then builds and
# publishes the staging APK (app-release.yml), which runs these same checks
# beside the build.
#
# The suite is split across SHARDS machines that run at the same time
# (`flutter test --total-shards`), so it takes about a quarter of the time.
# Each machine spends about two minutes setting up, so more shards cost more
# Actions minutes for less gain.
name: App checks

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "App/**"
      - ".github/workflows/app-checks.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its older run. A release's checks
  # are never cancelled, so every merge into main finishes its release.
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FLUTTER_VERSION: 3.47.9 # keep in step with App/README.md and app-release.yml

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub

  test:
    name: Test (${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4] # keep --total-shards below in step
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter test --no-pub --total-shards=4 --shard-index=$(( ${{ matrix.shard }} - 1 ))
