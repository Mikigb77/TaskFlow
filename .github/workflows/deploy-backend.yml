# Deploys the staging API from main: a merge into main that changes what the
# API's image is built from is a release. Steps: Backend/scripts/deploy-staging-ci.sh
# (build, migrate, replace the service, check /api/health/).
#
# Google sign-in is keyless (Workload Identity Federation), and only main of
# this repo can use it. One-time setup: TaskFlowWeb's
# scripts/dev/setup-github-deploy.sh. See Backend/docs/STAGING.md.
name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "Backend/core/**"
      - "Backend/config/**"
      - "Backend/templates/**"
      - "Backend/manage.py"
      - "Backend/requirements.txt"
      - "Backend/requirements.lock"
      - "Backend/Dockerfile"
      - "Backend/.dockerignore"
      - "Backend/scripts/start-server.sh"
      - "Backend/scripts/deploy-staging-ci.sh"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  tests:
    name: Django tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: Backend/requirements.lock
      - run: pip install -r requirements.lock
      - name: python manage.py test core
        run: |
          set -a; . ./.env; set +a
          export GEMINI_API_KEY= REVENUECAT_API_KEY= POSTGRES_PASSWORD= DJANGO_SECRET_KEY=ci-only-not-a-secret
          python manage.py test core --settings=config.test_settings

  staging:
    name: Staging API on Cloud Run
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/177649734578/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@taskflow-511107.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@v3
      - run: bash Backend/scripts/deploy-staging-ci.sh
