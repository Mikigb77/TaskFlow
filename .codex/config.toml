# Project roles only: leave the user's main-chat model and permissions unchanged.
[agents]
# Documented alias supported by the installed CLI's older role loader too.
max_threads = 3

# Explicit registration also supports clients using the config-layer role loader.
# The same files are discoverable as standalone custom agents by newer clients.
[agents.taskflow_ux_orchestrator]
description = "Coordinate TaskFlow app/web UX review, planning, fixes and verification using the shared Claude history."
config_file = "agents/taskflow_ux_orchestrator.toml"

[agents.taskflow_ux_reviewer]
description = "Independently review or verify a bounded TaskFlow app/web area; return findings without editing files."
config_file = "agents/taskflow_ux_reviewer.toml"

[agents.taskflow_ux_implementer]
description = "Implement one approved TaskFlow UX package within its assigned files."
config_file = "agents/taskflow_ux_implementer.toml"

[agents.taskflow_ux_tester]
description = "Independently verify TaskFlow UX acceptance criteria and add meaningful regression coverage."
config_file = "agents/taskflow_ux_tester.toml"
