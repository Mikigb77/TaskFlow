plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def taskflowDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { encoded ->
        def pair = new String(encoded.decodeBase64(), 'UTF-8').split('=', 2)
        if (pair.length == 2) taskflowDefines[pair[0]] = pair[1]
    }
}
def taskflowStaging = taskflowDefines['APP_ENV'] == 'staging'
def taskflowReleaseVerification = taskflowStaging &&
    file(project.findProperty('target') ?: 'lib/main.dart').name == 'staging_billing_release_test.dart'
def taskflowTestStoreKey = taskflowDefines['REVENUECAT_TEST_API_KEY'] ?: ''
// Private staging APKs must never become a Play Store bundle.
if (taskflowStaging && gradle.startParameter.taskNames.any { it.tokenize(':').last() == 'bundleRelease' }) {
    throw new GradleException('Staging uses RevenueCat Test Store. Build a private APK; use production configuration for a store bundle.')
}
def taskflowSigning = new Properties()
def taskflowSigningFile = rootProject.file('../.credentials/staging-signing.properties')
if (taskflowStaging) {
    if (!taskflowSigningFile.exists()) throw new GradleException('Run scripts/build-staging.ps1 to prepare private staging signing.')
    taskflowSigningFile.withInputStream { taskflowSigning.load(it) }
}

android {
    namespace = "com.example.agenda"
    // permission_handler 13 compiles against Android 17 (API 37); Flutter's
    // default is 36. targetSdk stays Flutter's, so runtime behaviour is unchanged.
    compileSdk = Math.max(flutter.compileSdkVersion, 37)
    ndkVersion = flutter.ndkVersion
    buildFeatures {
        resValues = true
        buildConfig = true
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    dependencies {
        coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.agenda"
        if (taskflowStaging) applicationIdSuffix = ".staging"
        manifestPlaceholders['taskflowLabel'] = taskflowStaging ? 'TaskFlow Staging' : 'TaskFlow'
        manifestPlaceholders['taskflowScheme'] = taskflowStaging ? 'taskflow-staging' : 'taskflow'
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // RevenueCat's native paywall requires Android 7 (API 24) or newer.
        minSdk = Math.max(flutter.minSdkVersion, 24)
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'boolean', 'TASKFLOW_INTERNAL_STAGING', taskflowStaging.toString()
        buildConfigField 'String', 'TASKFLOW_TEST_STORE_KEY', groovy.json.JsonOutput.toJson(taskflowStaging ? taskflowTestStoreKey : '')
    }

    signingConfigs {
        if (taskflowStaging) {
            staging {
                storeFile = file(taskflowSigning['storeFile'])
                storePassword = taskflowSigning['storePassword']
                keyAlias = taskflowSigning['keyAlias']
                keyPassword = taskflowSigning['keyPassword']
            }
        }
    }
    // Only the private staging APK may install its own updates
    // (AppUpdateBridge); the production app updates through Google Play, and
    // Play restricts REQUEST_INSTALL_PACKAGES.
    if (taskflowStaging) {
        sourceSets.release.manifest.srcFile 'src/staging/AndroidManifest.xml'
    }
    testBuildType = taskflowStaging ? 'release' : 'debug'
    buildTypes {
        debug {
            // Staging integration builds must update the same isolated package.
            if (taskflowStaging) signingConfig = signingConfigs.staging
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = taskflowStaging ? signingConfigs.staging : signingConfigs.debug
            if (taskflowReleaseVerification) {
                // Retain only the APIs called by the external instrumentation
                // APK. R8 cannot infer those callers when shrinking the app.
                proguardFiles 'staging-test-rules.pro'
            }
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    // Keep aligned with purchases_flutter 11.0.0. Its Android SDK (v11)
    // exposes the documented internal-release Test Store setting.
    implementation 'com.revenuecat.purchases:purchases-hybrid-common:20.0.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.4.0'
}

flutter {
    source = "../.."
}
