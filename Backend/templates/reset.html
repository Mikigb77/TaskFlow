<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password · TaskFlow</title>
<style>body{font:17px system-ui;background:#141920;color:#edf3ef;max-width:480px;margin:10vh auto;padding:25px}input,button{box-sizing:border-box;width:100%;padding:15px;margin:15px 0;border-radius:10px;font:inherit}button{background:#9dd8b3;border:0}p{line-height:1.5}</style>
<h1>Reset your password</h1><p>Choose a new password with at least 12 characters.</p><form id="form"><input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required aria-label="New password"><button>Update password</button></form><p role="status" id="message"></p><a href="/" style="color:#9dd8b3">Back to TaskFlow</a>
<script>const query=new URLSearchParams(location.search);const code=`${query.get('uid')}:${query.get('token')}`;history.replaceState(null,'',location.pathname);document.getElementById('form').onsubmit=async e=>{e.preventDefault();e.submitter.disabled=true;try{const r=await fetch('/api/auth/password-reset/confirm/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,password:document.getElementById('password').value})});const d=await r.json();document.getElementById('message').textContent=d.detail||JSON.stringify(d);if(r.ok)document.getElementById('form').hidden=true}catch(e){document.getElementById('message').textContent='Unable to reach the server.'}finally{e.submitter.disabled=false}};</script></html>
